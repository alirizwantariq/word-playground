<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg, #241650 0%, #150F33 55%, #35145e 100%);
    color: #fff;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
  .b1 { width: 340px; height: 340px; background: #FF8A3D; top: -120px; left: -100px; }
  .b2 { width: 300px; height: 300px; background: #B479FF; bottom: -130px; right: -80px; }
  .wrap { position: relative; z-index: 2; display: flex; height: 100%; align-items: center; padding: 0 44px; gap: 32px; }
  .art { flex: none; }
  .text { flex: 1; }
  h1 { font-size: 80px; font-weight: 900; letter-spacing: 1px; line-height: .95; }
  h1 .grad {
    background: linear-gradient(135deg, #FF8A3D, #FF5E78);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { font-size: 30px; font-weight: 700; color: #FFD447; margin-top: 16px; letter-spacing: 1px; }
  .badges { margin-top: 24px; display: flex; gap: 14px; }
  .badge {
    background: rgba(255,255,255,.12);
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="wrap">

    <!-- same art as the app icon: W + P tiles threaded on a rope -->
    <svg class="art" width="290" height="290" viewBox="0 0 360 360">
      <g>
        <line x1="8" y1="352" x2="352" y2="8" stroke="#4FA3A3" stroke-width="20" stroke-linecap="round"/>
        <rect x="36" y="196" width="150" height="17" rx="8.5" fill="#D96F1F"/>
        <rect x="36" y="176" width="150" height="150" rx="33" fill="#FF8A3D"/>
        <text x="111" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="93" font-weight="bold" fill="#fff" text-anchor="middle">W</text>
        <rect x="196" y="26" width="118" height="14" rx="7" fill="#D63A5C"/>
        <rect x="196" y="46" width="118" height="118" rx="26" fill="#FF5E78"/>
        <text x="255" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="73" font-weight="bold" fill="#fff" text-anchor="middle">P</text>
        <g transform="translate(52 62)">
          <path d="M25 0 L31 17 L49 17 L34 28 L40 45 L25 34 L10 45 L16 28 L1 17 L19 17 Z" fill="#FFD447"/>
        </g>
        <circle cx="330" cy="132" r="7" fill="#fff" opacity=".9"/>
        <circle cx="132" cy="330" r="6" fill="#fff" opacity=".7"/>
      </g>
    </svg>

    <div class="text">
      <h1><span class="grad">WORD<br>PLAYGROUND</span></h1>
      <div class="tag">3 quick word games in your pocket!</div>
      <div class="badges">
        <span class="badge">80 LEVELS</span>
        <span class="badge">2–4 PLAYERS</span>
        <span class="badge">WORKS OFFLINE</span>
      </div>
    </div>
  </div>
</body>
</html>
